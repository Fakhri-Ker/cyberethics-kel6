<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Selamat datang di Adab Digital</title>
  <meta name="description" content="Pintu masuk ke Adab Digital, website belajar etika di era teknologi informasi (cyberethics).">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Literata:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="start">
  <main id="intro">
    <div class="pintu kiri"></div><div class="pintu kanan"></div>
    <div class="isi">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="8" width="24" height="24" fill="none" stroke="#E3B35A" stroke-width="2.4"/><rect x="8" y="8" width="24" height="24" fill="none" stroke="#E3B35A" stroke-width="2.4" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="3.4" fill="#E3B35A"/></svg>
      <h1>Adab Digital</h1>
      <p>Etika di era teknologi informasi. Apa yang baik di dunia nyata, baik pula di dunia maya.</p>
      <button id="start" type="button">Get Started</button>
      <a id="lewati" href="index.html">Lewati intro</a>
    </div>
  </main>
  <script>
    document.getElementById("lewati").addEventListener("click", function () {
      try { sessionStorage.setItem("masuk", "1"); } catch (e) {}
    });
    document.getElementById("start").addEventListener("click", function () {
      try { sessionStorage.setItem("putar", "1"); sessionStorage.setItem("masuk", "1"); } catch (e) {}
      document.getElementById("intro").classList.add("buka");
      setTimeout(function () { location.href = "index.html"; }, 900);
    });
  </script>
</body>
</html>
